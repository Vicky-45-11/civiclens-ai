line-length = 140
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
# B008: FastAPI's Depends()/File() defaults are the framework idiom.
# E501: dense query code is kept on single lines.
# UP042: the (str, Enum) form is kept for SQLAlchemy/pydantic compatibility.
ignore = ["B008", "E501", "UP042"]

[lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before the app is imported
"app/ai/classifier.py" = ["BLE001"]  # a broken checkpoint must fall back to demo mode, not crash
